<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>ポストの肖像 — POST PORTRAIT</title>
<style>
:root{
  --paper:#F1EDE3; --panel:#F8F5EE; --line:#DCD5C4;
  --ink:#262420; --dim:#857E6E; --accent:#C6472F; --accent-soft:#E8CFC5;
  --mono:"SF Mono",Menlo,Consolas,"Noto Sans Mono",monospace;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- setup ---------- */
#setup{min-height:100%;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:56px 22px;max-width:920px;margin:0 auto;position:relative}
.side-label{position:fixed;left:22px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:var(--serif);font-size:13px;letter-spacing:.5em;color:var(--dim);opacity:.7;pointer-events:none}
@media(max-width:1080px){.side-label{display:none}}
header{text-align:center}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--accent)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5vw,46px);letter-spacing:.3em;margin-top:14px;text-indent:.3em}
h1::after{content:"▌";color:var(--accent);font-size:.6em;vertical-align:.12em;margin-left:.1em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){h1::after{animation:none}}
.lead{margin-top:16px;color:var(--dim);font-size:13.5px;line-height:2}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;width:100%}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:250px;transition:border-color .2s}
.card.ok{border-color:var(--accent-soft)}
.card h2{font-family:var(--serif);font-size:13px;letter-spacing:.24em;color:var(--dim);font-weight:600}
.card.ok h2{color:var(--accent)}
#dropImg{cursor:pointer;align-items:center;justify-content:center;text-align:center}
#dropImg:hover{border-color:var(--accent-soft)}
.hint{color:var(--dim);font-size:12.5px;line-height:1.9}
#thumb{width:112px;height:112px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
textarea{flex:1;min-height:126px;resize:vertical;background:#FDFBF6;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:12.5px;line-height:1.8;padding:10px 12px;outline:none}
textarea:focus{border-color:var(--accent-soft)}
textarea::placeholder{color:#A79F8D}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--dim)}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--accent)}
.meta{font-family:var(--mono);font-size:12px;color:var(--accent);min-height:1em}
.row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.sel{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:8px}
select{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:12.5px}
#start{font-family:var(--serif);font-size:15px;letter-spacing:.28em;text-indent:.28em;color:#FBF8F1;background:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:13px 34px;cursor:pointer;transition:.18s}
#start:hover:not(:disabled){filter:brightness(1.08)}
#start:disabled{opacity:.35;cursor:not-allowed}
.foot{font-size:11.5px;color:#9A927E}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#hud button{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--dim);background:rgba(248,245,238,.88);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
#hud button:hover{color:var(--ink);border-color:var(--accent-soft)}
#stat{position:absolute;left:16px;bottom:14px;font-family:var(--mono);font-size:12px;color:var(--dim);opacity:0;transition:opacity 1.2s}
#stat.show{opacity:1}

/* ---------- mobile ---------- */
@media(max-width:600px){
  #setup{gap:26px;padding:36px 16px calc(28px + env(safe-area-inset-bottom))}
  .lead{font-size:12.5px;text-align:left}
  .lead br{display:none}
  .card{min-height:0;padding:16px}
  #dropImg{min-height:150px}
  textarea{min-height:150px;font-size:16px}
  select{font-size:16px;padding:8px 10px}
  .row{flex-direction:column;align-items:stretch;gap:12px;width:100%}
  .sel{justify-content:space-between;gap:12px}
  .sel select{flex:1;max-width:65%}
  #start{width:100%;padding:15px 0;margin-top:6px}
  #hud{top:auto;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));justify-content:stretch}
  #hud button{flex:1 1 30%;padding:12px 4px;font-size:11px;letter-spacing:.02em;white-space:nowrap}
  #stat{left:12px;right:12px;bottom:auto;top:calc(12px + env(safe-area-inset-top));font-size:11px}
}
</style>
</head>
<body>

<main id="setup">
  <span class="side-label">一字一句が、似顔になる</span>
  <header>
    <p class="eyebrow">POST → PORTRAIT</p>
    <h1>ポストの肖像</h1>
    <p class="lead">あなたのポストを、原稿用紙のように一字ずつ印字していく。<br>カメラが引くと、活字の大小がつくる濃淡があなたのアイコンになる。</p>
  </header>

  <section class="grid">
    <div class="card" id="dropImg" title="クリックして画像を選択">
      <h2>一・アイコン画像</h2>
      <p class="hint">画像ファイルをドロップ<br>またはクリックして選択</p>
      <img id="thumb" hidden alt="アイコンのプレビュー">
      <input id="fileImg" type="file" accept="image/*" hidden>
    </div>
    <div class="card" id="dropText">
      <h2>二・ポストの文言</h2>
      <textarea id="ta" placeholder="ここにポストを貼り付け（複数まとめてOK）&#10;または X のアーカイブ tweets.js / テキストファイルをこのカードにドロップ"></textarea>
      <div class="opts">
        <label><input type="checkbox" id="optWS" checked>空白・改行を詰める</label>
        <label><input type="checkbox" id="optURL" checked>URLを外す</label>
      </div>
      <p class="meta" id="metaText">0 文字</p>
    </div>
  </section>

  <div class="row">
    <label class="sel">地の色
      <select id="bgMode">
        <option value="auto" selected>自動</option>
        <option value="paper">紙（明）</option>
        <option value="dark">黒（暗）</option>
      </select>
    </label>
    <label class="sel">表現
      <select id="mark">
        <option value="sumi">墨（大きさで濃淡）</option>
        <option value="color" selected>彩色（大きさ＋色）</option>
      </select>
    </label>
    <label class="sel">文字の密度
      <select id="density">
        <option value="4500">あらい</option>
        <option value="10000">ふつう</option>
        <option value="18000" selected>こまかい</option>
      </select>
    </label>
    <button id="start" disabled>印字をはじめる</button>
  </div>
  <p class="foot">画像もテキストもブラウザの外へは送信されません。</p>
</main>

<div id="stage" hidden>
  <canvas id="cv"></canvas>
  <div id="hud">
    <button id="skip">最後まで送る</button>
    <button id="replay">もう一度</button>
    <button id="rec">動画で保存</button>
    <button id="save">PNG保存</button>
    <button id="back">設定に戻る</button>
  </div>
  <div id="stat"></div>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const FAMS='Menlo, Consolas, "Noto Sans Mono", "Hiragino Sans", "Yu Gothic", monospace';
const MODES={
  paper:{bg:'#F1EDE3',bgRGB:[241,237,227],ink:[38,36,31],grid:'150,132,96',frame:'198,71,47'},
  dark:{bg:'#141311',bgRGB:[20,19,17],ink:[236,231,219],grid:'186,176,148',frame:'216,110,76'}
};
let MODE=MODES.paper;

/* ---------- 入力 ---------- */
const setupEl=$('setup'),stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const dropImg=$('dropImg'),fileImg=$('fileImg'),thumb=$('thumb');
const dropText=$('dropText'),ta=$('ta'),metaText=$('metaText'),startBtn=$('start');
let iconImg=null, fileTweets=null;

function setImage(file){
  if(!file||!file.type.startsWith('image/'))return;
  const url=URL.createObjectURL(file); const im=new Image();
  im.onload=()=>{iconImg=im;thumb.src=url;thumb.hidden=false;dropImg.classList.add('ok');refresh();};
  im.src=url;
}
dropImg.addEventListener('click',()=>fileImg.click());
fileImg.addEventListener('change',e=>setImage(e.target.files[0]));
dropImg.addEventListener('dragover',e=>e.preventDefault());
dropImg.addEventListener('drop',e=>{const f=e.dataTransfer.files[0]; if(f){e.preventDefault();setImage(f);}});
dropText.addEventListener('dragover',e=>e.preventDefault());
dropText.addEventListener('drop',e=>{const f=e.dataTransfer.files[0]; if(f){e.preventDefault();handleTextFile(f);}});

function handleTextFile(file){
  file.text().then(txt=>{
    const tw=extractTweets(txt);
    if(tw){fileTweets=tw;ta.value='';
      ta.placeholder=`${file.name} を読み込みました（${tw.length.toLocaleString()} ポスト）\n貼り付けると上書きされます`;}
    else{fileTweets=null;ta.value=txt;}
    dropText.classList.add('ok');refresh();
  });
}
function extractTweets(txt){
  let s=txt.trim();
  const m=s.match(/^window\.YTD[^=]*=/); if(m)s=s.slice(m[0].length);
  try{
    const data=JSON.parse(s); const out=[];
    (function walk(o){
      if(Array.isArray(o)){o.forEach(walk);return;}
      if(o&&typeof o==='object'){
        if(typeof o.full_text==='string')out.push(o.full_text);
        else Object.values(o).forEach(walk);
      }
    })(data);
    return out.length?out:null;
  }catch(_){return null;}
}
function activeTweets(){
  if(!fileTweets)return null;
  return fileTweets.filter(t=>!/^RT @/.test(t));
}
function composeText(){
  const tw=activeTweets();
  let text=tw?tw.join('\n'):ta.value;
  if($('optURL').checked)text=text.replace(/https?:\/\/\S+/g,'');
  text=text.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  text=$('optWS').checked?text.replace(/\s+/g,''):text.replace(/\s+/g,' ').trim();
  return text;
}
function refresh(){
  const n=[...composeText()].length;
  const tw=activeTweets();
  metaText.textContent=tw?`${tw.length.toLocaleString()} ポスト / ${n.toLocaleString()} 文字`:`${n.toLocaleString()} 文字`;
  startBtn.disabled=!(iconImg&&n>0);
}
ta.addEventListener('input',()=>{ if(ta.value)fileTweets=null; refresh(); });
['optWS','optURL'].forEach(id=>$(id).addEventListener('change',refresh));

/* ---------- エンジン ---------- */
const CELL=20;
let cols=0,rows=0,N=0,cells=null,worldW=0,worldH=0;
let baked=null,bctx=null,BAKE=32,stamped=0;
const FSTEPS=12, FMIN=.3, FMAX=1.9;
let cellFonts=[],bakeFonts=[];
let charsTotal=0,loops=1,usedPosts=0;
let t0=0,DUR=24000,playing=false,done=false,settle=false,raf=0,camInit=false;
const cam={x:0,y:0,s:1};
let interactive=false,dragSt=null;

// 文字ごとの実インク量（em²あたりの被覆率）を計測してキャッシュ
function makeInkMeter(){
  const M=28, S=36;
  const mc=document.createElement('canvas'); mc.width=mc.height=S;
  const m=mc.getContext('2d',{willReadFrequently:true});
  m.textAlign='center'; m.textBaseline='middle'; m.font=`${M}px ${FAMS}`;
  const cache=new Map();
  return ch=>{
    let v=cache.get(ch);
    if(v===undefined){
      m.clearRect(0,0,S,S); m.fillStyle='#000';
      m.fillText(ch,S/2,S/2);
      const p=m.getImageData(0,0,S,S).data; let s=0;
      for(let j=3;j<p.length;j+=4)s+=p[j];
      v=s/255/(M*M); cache.set(ch,v);
    }
    return v;
  };
}

function buildCells(img,text,target){
  const aspect=img.naturalWidth/Math.max(1,img.naturalHeight);
  cols=clamp(Math.round(Math.sqrt(target*aspect)),20,160);
  rows=clamp(Math.round(cols/aspect),20,160);
  N=cols*rows; worldW=cols*CELL; worldH=rows*CELL;
  const oc=document.createElement('canvas'); oc.width=cols; oc.height=rows;
  const o=oc.getContext('2d',{willReadFrequently:true});
  o.drawImage(img,0,0,cols,rows);
  const d=o.getImageData(0,0,cols,rows).data;
  const chars=[...text]; charsTotal=chars.length; loops=Math.ceil(N/charsTotal);
  // 地の色（自動：アイコンの平均輝度で判定）
  const sel=$('bgMode').value;
  if(sel==='auto'){
    let sum=0,wt=0;
    for(let i=0;i<cols*rows;i++){
      const a=d[i*4+3]/255;
      sum+=a*(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2])/255; wt+=a;
    }
    MODE=(wt>0&&sum/wt<.5)?MODES.dark:MODES.paper;
  } else MODE=(sel==='dark')?MODES.dark:MODES.paper;
  const isDark=(MODE===MODES.dark);
  const colorMode=$('mark').value==='color';
  const [br,bg2,bb]=MODE.bgRGB, [ir,ig,ib]=MODE.ink;

  // 1) 各セルの目標トーン（紙なら暗いほど、黒地なら明るいほどインクを置く）
  const tone=new Float32Array(N), rgbs=new Uint8ClampedArray(N*3);
  for(let i=0;i<N;i++){
    let r=d[i*4],g=d[i*4+1],b=d[i*4+2]; const a=d[i*4+3]/255;
    if(a<1){r=r*a+br*(1-a); g=g*a+bg2*(1-a); b=b*a+bb*(1-a);}
    const L=(.299*r+.587*g+.114*b)/255;
    tone[i]=isDark?L:1-L;
    rgbs[i*3]=r; rgbs[i*3+1]=g; rgbs[i*3+2]=b;
  }
  // コントラストを自動で伸ばす（2〜98パーセンタイル）
  const sorted=Float32Array.from(tone).sort();
  const lo=sorted[Math.floor(N*.02)], hi=sorted[Math.min(N-1,Math.floor(N*.98))];
  const stretch=(hi-lo)>.05;

  // 2) 文字の実インク量から、目標トーンに合うサイズを解く
  const covOf=makeInkMeter();
  cells=new Array(N);
  for(let i=0;i<N;i++){
    const ch=chars[i%charsTotal];
    const t=stretch?clamp((tone[i]-lo)/(hi-lo),0,1):clamp(tone[i],0,1);
    const T=.02+.83*Math.pow(t,1.1);           // 目標被覆率
    const c=Math.max(.02,covOf(ch));           // この文字のインク量
    const need=Math.sqrt(T/c);
    const f=clamp(need,FMIN,FMAX);             // 必要な文字サイズ（セル比）
    const dbl=need>FMAX*1.15;                  // 細い文字は二度打ちで補う
    const bkt=clamp(Math.round((f-FMIN)/(FMAX-FMIN)*(FSTEPS-1)),0,FSTEPS-1);
    let col;
    if(colorMode){
      let r=rgbs[i*3],g=rgbs[i*3+1],b=rgbs[i*3+2];
      const mx=Math.max(r,g,b,1), tgt=isDark?225:120;
      r=r/mx*tgt; g=g/mx*tgt; b=b/mx*tgt;
      col=`rgb(${r|0},${g|0},${b|0})`;
    } else col=`rgb(${ir},${ig},${ib})`;
    cells[i]={ch,bkt,col,dbl};
  }
  BAKE=Math.min(32,Math.floor(4000/Math.max(cols,rows)));
  baked=document.createElement('canvas'); baked.width=cols*BAKE; baked.height=rows*BAKE;
  bctx=baked.getContext('2d');
  bctx.textAlign='center'; bctx.textBaseline='middle';
  cellFonts=[]; bakeFonts=[];
  for(let b=0;b<FSTEPS;b++){
    const f=FMIN+(FMAX-FMIN)*b/(FSTEPS-1);
    cellFonts.push(`${(CELL*f).toFixed(1)}px ${FAMS}`);
    bakeFonts.push(`${Math.max(4,Math.round(BAKE*f))}px ${FAMS}`);
  }
  stamped=0;
}
function stampTo(n){
  for(let i=stamped;i<n;i++){
    const c=cells[i], x=((i%cols)+.5)*BAKE, y=(((i/cols)|0)+.5)*BAKE;
    bctx.font=bakeFonts[c.bkt];
    bctx.fillStyle=c.col;
    bctx.fillText(c.ch,x,y);
    if(c.dbl)bctx.fillText(c.ch,x+BAKE*.06,y+BAKE*.04);
  }
  stamped=n;
}
const printCurve=p=>(Math.exp(7*p)-1)/(Math.exp(7)-1);
const fitScale=(w,h)=>Math.min(w/worldW,h/worldH)*.92;
function axisClamp(v,half,size){ return size<=half*2 ? size/2 : clamp(v,half,size-half); }

function frame(now){
  raf=requestAnimationFrame(frame);
  const w=stage.clientWidth||1, h=stage.clientHeight||1;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  const s1=fitScale(w,h);
  let printed=stamped;

  if(playing){
    const p=clamp((now-t0)/DUR,0,1);
    const f=printCurve(p);
    printed=clamp(Math.floor(f*N),1,N);
    const idxF=Math.min(N-1,f*N);
    const cx=((idxF%cols)+.5)*CELL, cy=(((idxF/cols)|0)+.5)*CELL;
    const s0=Math.max(s1*3, w/(14*CELL));
    const z=easeInOut(clamp((p-.10)/.82,0,1));
    const sT=Math.exp(lerp(Math.log(s0),Math.log(s1),z));
    let tx=lerp(cx,worldW/2,z), ty=lerp(cy,worldH/2,z);
    tx=axisClamp(tx,w/(2*sT),worldW); ty=axisClamp(ty,h/(2*sT),worldH);
    if(!camInit){cam.x=tx;cam.y=ty;cam.s=sT;camInit=true;}
    cam.x+=(tx-cam.x)*.18; cam.y+=(ty-cam.y)*.18;
    cam.s=Math.exp(Math.log(cam.s)+(Math.log(sT)-Math.log(cam.s))*.12);
    if(p>=1){printed=N; playing=false; done=true; interactive=true; settle=true; showStat(); finishRecording();}
  } else if(done&&settle){
    cam.s+=(s1-cam.s)*.08;
    cam.x+=(worldW/2-cam.x)*.08; cam.y+=(worldH/2-cam.y)*.08;
  }
  stampTo(printed);

  // 描画
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=MODE.bg; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*cam.s,0,0,dpr*cam.s, dpr*(w/2-cam.s*cam.x), dpr*(h/2-cam.s*cam.y));
  const pxCell=cam.s*CELL*dpr;

  if(pxCell>BAKE){
    // 近景：ベクタ描画（見えているセルのみ）
    const hw=w/(2*cam.s), hh=h/(2*cam.s);
    const c0=clamp(Math.floor((cam.x-hw)/CELL)-1,0,cols-1);
    const c1=clamp(Math.ceil((cam.x+hw)/CELL)+1,0,cols-1);
    const r0=clamp(Math.floor((cam.y-hh)/CELL)-1,0,rows-1);
    const r1=clamp(Math.ceil((cam.y+hh)/CELL)+1,0,rows-1);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let r=r0;r<=r1;r++){
      const base=r*cols;
      for(let c=c0;c<=c1;c++){
        const i=base+c; if(i>=printed)continue;
        const cell=cells[i], gx=(c+.5)*CELL, gy=(r+.5)*CELL;
        ctx.font=cellFonts[cell.bkt];
        ctx.fillStyle=cell.col;
        ctx.fillText(cell.ch,gx,gy);
        if(cell.dbl)ctx.fillText(cell.ch,gx+CELL*.06,gy+CELL*.04);
      }
    }
    // 原稿用紙の罫線（引きでは消える）
    const gA=clamp((pxCell/BAKE-1)/1.5,0,1)*.3;
    if(gA>.02){
      ctx.strokeStyle=`rgba(${MODE.grid},${gA.toFixed(3)})`;
      ctx.lineWidth=1/(cam.s*dpr);
      ctx.beginPath();
      for(let c=c0;c<=c1+1;c++){const x=c*CELL;ctx.moveTo(x,r0*CELL);ctx.lineTo(x,(r1+1)*CELL);}
      for(let r=r0;r<=r1+1;r++){const y=r*CELL;ctx.moveTo(c0*CELL,y);ctx.lineTo((c1+1)*CELL,y);}
      ctx.stroke();
    }
    if(playing&&printed<N){
      const ci=printed, ccx=(ci%cols)*CELL, ccy=((ci/cols)|0)*CELL;
      ctx.fillStyle=`rgba(${MODE.frame},${(.3+.45*Math.abs(Math.sin(now/170))).toFixed(3)})`;
      ctx.fillRect(ccx+2,ccy+2,CELL-4,CELL-4);
    }
  } else {
    // 遠景：焼き込みキャンバスを転写
    ctx.drawImage(baked,0,0,baked.width,baked.height,0,0,worldW,worldH);
  }
  // 用紙の外枠（朱）
  ctx.strokeStyle=`rgba(${MODE.frame},.38)`;
  ctx.lineWidth=1.4/(cam.s*dpr);
  ctx.strokeRect(0,0,worldW,worldH);
}

/* ---------- 実行 ---------- */
function startRun(){
  const text=composeText();
  if(!iconImg||!text)return;
  const tw=activeTweets(); usedPosts=tw?tw.length:0;
  buildCells(iconImg,text,+$('density').value);
  setupEl.hidden=true; stage.hidden=false;
  stage.style.background=MODE.bg;
  done=false; interactive=false; settle=false; camInit=false; dragSt=null;
  $('stat').classList.remove('show'); cv.style.cursor='default';
  t0=performance.now(); playing=true;
  cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
}
startBtn.addEventListener('click',startRun);

function showStat(){
  const use=charsTotal>=N
    ? `先頭 ${N.toLocaleString()} 文字を使用`
    : `${charsTotal.toLocaleString()} 文字 × 約${loops}周`;
  $('stat').textContent=`${usedPosts?usedPosts.toLocaleString()+' ポスト / ':''}${use} — ${cols}×${rows} セル`;
  $('stat').classList.add('show');
  cv.style.cursor='grab';
}
function restartPlay(){
  stamped=0; bctx.clearRect(0,0,baked.width,baked.height);
  done=false; interactive=false; settle=false; camInit=false; dragSt=null;
  $('stat').classList.remove('show'); cv.style.cursor='default';
  t0=performance.now(); playing=true;
}
$('skip').addEventListener('click',()=>{ if(playing)t0=performance.now()-DUR; });
$('replay').addEventListener('click',()=>{
  if(!baked)return;
  abortRecording();
  restartPlay();
});
$('back').addEventListener('click',()=>{
  abortRecording();
  cancelAnimationFrame(raf); playing=false;
  stage.hidden=true; setupEl.hidden=false;
});

/* ---------- 動画の録画（印字をもう一度再生しながら記録） ---------- */
const recBtn=$('rec');
let rec=null,recChunks=null,recAbort=false;
if(typeof MediaRecorder==='undefined'||!cv.captureStream)recBtn.hidden=true;
function recMime(){
  return ['video/mp4','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
}
function resetRecUI(){
  rec=null; recChunks=null;
  recBtn.textContent='動画で保存'; recBtn.disabled=false;
}
recBtn.addEventListener('click',()=>{
  if(!baked||rec)return;
  const mime=recMime();
  recChunks=[];
  try{
    rec=new MediaRecorder(cv.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6});
  }catch(_){recBtn.hidden=true;return;}
  rec.ondataavailable=e=>{ if(e.data&&e.data.size)recChunks.push(e.data); };
  rec.onstop=()=>{
    if(recAbort){recAbort=false;resetRecUI();return;}
    const type=(rec&&rec.mimeType)||mime||'video/webm';
    const blob=new Blob(recChunks,{type});
    const a=document.createElement('a');
    a.download='post-portrait.'+(/mp4/.test(type)?'mp4':'webm');
    a.href=URL.createObjectURL(blob);
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    resetRecUI();
  };
  rec.start(500);
  recBtn.textContent='録画中…'; recBtn.disabled=true;
  restartPlay();
});
function finishRecording(){
  if(!rec)return;
  // 引き切った画をすこし収めてから止める
  setTimeout(()=>{ if(rec&&rec.state==='recording')rec.stop(); },1400);
}
function abortRecording(){
  if(rec&&rec.state!=='inactive'){recAbort=true;rec.stop();}
  else if(rec)resetRecUI();
}
$('save').addEventListener('click',()=>{
  if(!baked)return;
  const pad=Math.round(baked.width*.05);
  const out=document.createElement('canvas');
  out.width=baked.width+pad*2; out.height=baked.height+pad*2;
  const o=out.getContext('2d');
  o.fillStyle=MODE.bg; o.fillRect(0,0,out.width,out.height);
  o.drawImage(baked,pad,pad);
  o.strokeStyle=`rgba(${MODE.frame},.45)`;
  o.lineWidth=Math.max(2,baked.width*.0015);
  o.strokeRect(pad,pad,baked.width,baked.height);
  const a=document.createElement('a');
  a.download='post-portrait.png';
  a.href=out.toDataURL('image/png');
  a.click();
});

/* ---------- 完了後の探索操作 ---------- */
cv.addEventListener('wheel',e=>{
  if(!interactive)return; e.preventDefault(); settle=false;
  const w=stage.clientWidth,h=stage.clientHeight;
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const wx=cam.x+(mx-w/2)/cam.s, wy=cam.y+(my-h/2)/cam.s;
  cam.s=clamp(cam.s*Math.exp(-e.deltaY*.0016), fitScale(w,h)*.4, 60);
  cam.x=wx-(mx-w/2)/cam.s; cam.y=wy-(my-h/2)/cam.s;
},{passive:false});
const ptrs=new Map(); let pinchSt=null;
cv.addEventListener('pointerdown',e=>{
  if(!interactive)return; settle=false;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  cv.setPointerCapture(e.pointerId);
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinchSt={d:Math.hypot(a.x-b.x,a.y-b.y),s:cam.s,cx:cam.x,cy:cam.y,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
    dragSt=null;
  } else if(ptrs.size===1){
    dragSt={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
    cv.style.cursor='grabbing';
  }
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinchSt&&ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const w=stage.clientWidth,h=stage.clientHeight;
    const rect=cv.getBoundingClientRect();
    const wx=pinchSt.cx+(pinchSt.mx-rect.left-w/2)/pinchSt.s;
    const wy=pinchSt.cy+(pinchSt.my-rect.top-h/2)/pinchSt.s;
    const mx=(a.x+b.x)/2-rect.left, my=(a.y+b.y)/2-rect.top;
    cam.s=clamp(pinchSt.s*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,pinchSt.d), fitScale(w,h)*.4, 60);
    cam.x=wx-(mx-w/2)/cam.s; cam.y=wy-(my-h/2)/cam.s;
  } else if(dragSt){
    cam.x=dragSt.cx-(e.clientX-dragSt.x)/cam.s;
    cam.y=dragSt.cy-(e.clientY-dragSt.y)/cam.s;
  }
});
const endPtr=e=>{
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinchSt=null;
  if(ptrs.size===0){ dragSt=null; if(interactive)cv.style.cursor='grab'; }
  else if(ptrs.size===1&&!pinchSt){
    const [p]=[...ptrs.values()];
    dragSt={x:p.x,y:p.y,cx:cam.x,cy:cam.y};
  }
};
addEventListener('pointerup',endPtr);
addEventListener('pointercancel',endPtr);
cv.addEventListener('dblclick',()=>{ if(interactive)settle=true; });
})();
</script>
</body>
</html>
